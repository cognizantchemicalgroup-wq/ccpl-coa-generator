<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Documents - COA Generator</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 28px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        .btn-info {
            background: #3498db;
            color: white;
        }

        .btn-info:hover {
            background: #2980b9;
        }

        .search-filter {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .filter-box {
            min-width: 200px;
        }

        .filter-box select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #667eea;
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #555;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 80;
            background: rgba(0, 0, 0, 0.5);
            overflow: auto;
        }

        .modal-content {
            background: white;
            margin: 2% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 1500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .modal-header h2 {
            color: #2c3e50;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        #pdfPreview {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .search-filter {
                flex-direction: column;
            }

            .table-container {
                overflow-x: scroll;
            }

            table {
                min-width: 800px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Saved Documents</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="exportToExcel()">Export to Excel</button>
                <a href="index.html" class="btn btn-primary">New COA</a>
                <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
            </div>
        </div>

        <div class="search-filter">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by Product Code, Name, or Batch No..."
                    oninput="filterDocuments()">
            </div>
            <div class="filter-box">
                <select id="categoryFilter" onchange="filterDocuments()">
                    <option value="">All Categories</option>
                    <option value="Raw Material">Raw Material</option>
                    <option value="Finish Goods">Finish Goods</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <div id="loadingMessage" class="loading">Loading documents...</div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <h3>No documents found</h3>
                <p>Create your first COA document to get started.</p>
            </div>
            <table id="documentsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Product Code</th>
                        <th>Product Name / Chemical Name</th>
                        <th>Batch No.</th>
                        <th>Category</th>
                        <th>Created At</th>
                        <th>Updated At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="documentsBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- PDF Preview Modal -->
    <div id="previewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>PDF Preview</h2>
                <span class="close" onclick="closePreview()">&times;</span>
            </div>
            <iframe id="pdfPreview" src=""></iframe>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Exporting to Excel...</div>
    </div>

    <script>
        let allDocuments = [];
        let filteredDocuments = [];

        // Check authentication
        function checkAuth() {
            const user = sessionStorage.getItem('ccpl_user');
            if (!user) {
                window.location.href = 'login.html';
                return null;
            }
            return JSON.parse(user);
        }

        // Logout handler
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.removeItem('ccpl_user');
                window.location.href = 'login.html';
            }
        }

        // Format date
        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Load all documents
        async function loadDocuments() {
            try {
                // Get current user
                const user = checkAuth();
                if (!user) {
                    return;
                }

                let querySnapshot;

                try {
                    // Try to filter by userId with orderBy (requires composite index)
                    querySnapshot = await db.collection('coa_documents')
                        .where('userId', '==', user.id)
                        .orderBy('updatedAt', 'desc')
                        .get();
                } catch (indexError) {
                    // If index doesn't exist, fetch all and filter in memory
                    if (indexError.code === 'failed-precondition') {
                        console.warn('Composite index not found, fetching all documents and filtering in memory');
                        const allDocs = await db.collection('coa_documents')
                            .orderBy('updatedAt', 'desc')
                            .get();

                        // Filter by userId in memory
                        allDocuments = [];
                        allDocs.forEach(doc => {
                            const data = doc.data();
                            if (data.userId === user.id) {
                                allDocuments.push({
                                    id: doc.id,
                                    ...data
                                });
                            }
                        });

                        filteredDocuments = allDocuments;
                        displayDocuments();
                        return;
                    } else {
                        throw indexError;
                    }
                }

                allDocuments = [];
                querySnapshot.forEach(doc => {
                    allDocuments.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                filteredDocuments = allDocuments;
                displayDocuments();
            } catch (error) {
                console.error('Error loading documents:', error);
                alert('Error loading documents: ' + error.message);
            }
        }

        // Display documents
        function displayDocuments() {
            const tbody = document.getElementById('documentsBody');
            const table = document.getElementById('documentsTable');
            const loading = document.getElementById('loadingMessage');
            const empty = document.getElementById('emptyState');

            loading.style.display = 'none';

            if (filteredDocuments.length === 0) {
                table.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            table.style.display = 'table';
            tbody.innerHTML = '';

            filteredDocuments.forEach(doc => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${doc.productCode || 'N/A'}</td>
                    <td>${doc.productName || doc.chemicalName || 'N/A'}</td>
                    <td>${doc.batchNo || 'N/A'}</td>
                    <td>${doc.category || 'N/A'}</td>
                    <td>${formatDate(doc.createdAt)}</td>
                    <td>${formatDate(doc.updatedAt)}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn btn-warning" onclick="editDocument('${doc.id}')">Edit</button>
                            <button class="action-btn btn-info" onclick="previewPDF('${doc.id}')">Preview</button>
                            <button class="action-btn btn-success" onclick="downloadPDF('${doc.id}')">Download</button>
                            <button class="action-btn btn-danger" onclick="deleteDocument('${doc.id}')">Delete</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Filter documents
        function filterDocuments() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;

            filteredDocuments = allDocuments.filter(doc => {
                const matchesSearch = !searchTerm ||
                    (doc.productCode && doc.productCode.toLowerCase().includes(searchTerm)) ||
                    (doc.productName && doc.productName.toLowerCase().includes(searchTerm)) ||
                    (doc.chemicalName && doc.chemicalName.toLowerCase().includes(searchTerm)) ||
                    (doc.batchNo && doc.batchNo.toLowerCase().includes(searchTerm));

                const matchesCategory = !categoryFilter || doc.category === categoryFilter;

                return matchesSearch && matchesCategory;
            });

            displayDocuments();
        }

        // Edit document
        async function editDocument(docId) {
            try {
                // Get current user
                const user = checkAuth();
                if (!user) {
                    return;
                }

                // Verify user owns this document before editing
                const docRef = db.collection('coa_documents').doc(docId);
                const doc = await docRef.get();

                if (!doc.exists) {
                    alert('Document not found!');
                    return;
                }

                const data = doc.data();
                if (data.userId !== user.id) {
                    alert('You do not have permission to edit this document. You can only edit your own documents.');
                    return;
                }

                window.location.href = `index.html?edit=${docId}`;
            } catch (error) {
                console.error('Error checking document ownership:', error);
                alert('Error: ' + error.message);
            }
        }

        // Delete document
        async function deleteDocument(docId) {
            if (!confirm('Are you sure you want to delete this document?')) {
                return;
            }

            try {
                // Get current user
                const user = checkAuth();
                if (!user) {
                    return;
                }

                // Verify user owns this document before deleting
                const docRef = db.collection('coa_documents').doc(docId);
                const doc = await docRef.get();

                if (!doc.exists) {
                    alert('Document not found!');
                    return;
                }

                const data = doc.data();
                if (data.userId !== user.id) {
                    alert('You do not have permission to delete this document. You can only delete your own documents.');
                    loadDocuments(); // Refresh to remove any UI inconsistencies
                    return;
                }

                await docRef.delete();
                alert('Document deleted successfully!');
                loadDocuments();
            } catch (error) {
                console.error('Error deleting document:', error);
                alert('Error deleting document: ' + error.message);
            }
        }

        // Preview PDF
        async function previewPDF(docId) {
            try {
                // Get current user
                const user = checkAuth();
                if (!user) {
                    return;
                }

                console.log('Preview PDF for document:', docId);
                const docRef = db.collection('coa_documents').doc(docId);
                const doc = await docRef.get();

                if (!doc.exists) {
                    alert('Document not found!');
                    return;
                }

                const data = doc.data();

                // Verify user owns this document
                if (data.userId !== user.id) {
                    alert('You do not have permission to view this document. You can only view your own documents.');
                    return;
                }
                console.log('Generating PDF for preview...', data);

                // Show loading
                const iframe = document.getElementById('pdfPreview');
                iframe.src = 'about:blank';
                document.getElementById('previewModal').style.display = 'block';

                const pdfBlob = await generatePDFFromData(data);
                const pdfUrl = URL.createObjectURL(pdfBlob);

                iframe.src = pdfUrl;
                console.log('PDF preview loaded');
            } catch (error) {
                console.error('Error generating PDF:', error);
                alert('Error generating PDF: ' + error.message);
                document.getElementById('previewModal').style.display = 'none';
            }
        }

        // Download PDF
        async function downloadPDF(docId) {
            try {
                // Get current user
                const user = checkAuth();
                if (!user) {
                    return;
                }

                console.log('Download PDF for document:', docId);
                const docRef = db.collection('coa_documents').doc(docId);
                const doc = await docRef.get();

                if (!doc.exists) {
                    alert('Document not found!');
                    return;
                }

                const data = doc.data();

                // Verify user owns this document
                if (data.userId !== user.id) {
                    alert('You do not have permission to download this document. You can only download your own documents.');
                    return;
                }
                console.log('Generating PDF for download...', data);

                const pdfBlob = await generatePDFFromData(data);
                const pdfUrl = URL.createObjectURL(pdfBlob);

                // Generate filename
                const productCode = data.productCode || 'COA';
                const batchNo = data.batchNo || 'BATCH';
                const fileName = `COA_${productCode}_${batchNo}.pdf`;

                const link = document.createElement('a');
                link.href = pdfUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Clean up after a delay
                setTimeout(() => {
                    URL.revokeObjectURL(pdfUrl);
                }, 100);

                console.log('PDF downloaded:', fileName);
            } catch (error) {
                console.error('Error generating PDF:', error);
                alert('Error generating PDF: ' + error.message);
            }
        }

        // Generate PDF from saved data - matches the format from index.html
        async function generatePDFFromData(data) {
            const { jsPDF } = window.jspdf;

            // Logo - load from index.html's logo string
            // Using the complete logo string (same as index.html)
            let logo = null;
            try {
                // Try to fetch the logo from the main page
                const response = await fetch('index.html');
                const html = await response.text();
                const logoMatch = html.match(/const logo = "([^"]+)"/);
                if (logoMatch && logoMatch[1]) {
                    logo = logoMatch[1];
                }
            } catch (e) {
                console.warn('Could not load logo, PDF will generate without it');
                logo = null;
            }

            // If still no logo, continue without it
            if (!logo) {
                console.log('Generating PDF without logo');
            }

            const doc = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4'
            });

            // Watermark setup
            const watermarkState = doc.GState({ opacity: 0.07 });
            function addWatermark() {
                if (!logo) return; // Skip watermark if logo not available
                try {
                    const w = doc.internal.pageSize.getWidth();
                    const h = doc.internal.pageSize.getHeight();
                    doc.setGState(watermarkState);
                    const wmWidth = 140;
                    const wmHeight = 140;
                    doc.addImage(logo, "PNG", (w - wmWidth) / 2, (h - wmHeight) / 2, wmWidth, wmHeight);
                    doc.setGState(new doc.GState({ opacity: 1 }));
                } catch (e) {
                    console.warn('Could not add watermark:', e);
                }
            }

            let pageNumber = 1;
            const totalPages = Math.ceil(data.testResults.length / 25) + 1;

            function addPageNumber(doc, currentPage, total) {
                doc.setFontSize(9);
                doc.setFont(undefined, 'normal');
                doc.setTextColor(100, 100, 100);
                doc.text(`Page ${currentPage}`, 105, 290, { align: 'center' });
                doc.setTextColor(0, 0, 0);
            }

            function drawHeader(isFirstPage = true) {
                doc.setFontSize(18);
                doc.setFont(undefined, 'bold');
                doc.setTextColor(102, 126, 234);
                // Add logo only if available
                if (logo) {
                    try {
                        doc.addImage(logo, "PNG", 160, 5, 30, 20);
                    } catch (e) {
                        console.warn('Could not add logo to header:', e);
                    }
                }
                doc.setTextColor(0, 0, 0);

                doc.setFontSize(12);
                doc.setFont(undefined, 'bold');
                const productNameText = data.productName || data.chemicalName;
                const productNameLines = doc.splitTextToSize(productNameText, 120);
                doc.text(productNameLines, 15, 15);

                let headerYPos = 15 + (productNameLines.length * 5);
                if (data.productData && data.productData.standard) {
                    doc.setFontSize(10);
                    doc.text(data.productData.standard, 15, headerYPos + 3);
                }

                doc.setLineWidth(0.5);
                doc.setDrawColor(102, 126, 234);
                doc.line(15, 28, 195, 28);
                doc.setDrawColor(0, 0, 0);
                doc.setLineWidth(0.1);
            }

            // Helper function to extract unit from specification
            function extractUnit(spec) {
                const unitMatch = spec.match(/(%|ppm|mL|g\/L|au|g\/mL|%w\/v|%w\/w)/i);
                return unitMatch ? unitMatch[1] : '';
            }

            // First page setup
            addWatermark();
            drawHeader(true);

            let yPos = 35;
            doc.setFontSize(9);
            doc.setFont(undefined, 'bold');
            doc.text('Product Name:', 15, yPos);
            doc.setFont(undefined, 'normal');
            const productNameText = data.productName || data.chemicalName;
            const productNameLines = doc.splitTextToSize(productNameText, 125);
            doc.text(productNameLines, 65, yPos);
            yPos += productNameLines.length * 5 + 1;

            doc.setFont(undefined, 'bold');
            doc.text('Batch No.:', 15, yPos);
            doc.setFont(undefined, 'normal');
            doc.text(data.batchNo || 'N/A', 65, yPos);
            yPos += 6;

            doc.setFont(undefined, 'bold');
            doc.text('Manufacturing Date:', 15, yPos);
            doc.setFont(undefined, 'normal');
            doc.text(formatDateForPDF(data.mfgDate), 65, yPos);
            yPos += 6;

            doc.setFont(undefined, 'bold');
            doc.text('Expiry Date:', 15, yPos);
            doc.setFont(undefined, 'normal');
            doc.text(formatDateForPDF(data.expiryDate), 65, yPos);
            yPos += 6;

            // Test results table header
            yPos += 8;
            doc.setFillColor(240, 240, 240);
            doc.rect(15, yPos - 5, 180, 8, 'F');

            doc.setFontSize(9);
            doc.setFont(undefined, 'bold');
            doc.text('Test Parameter', 17, yPos);
            doc.text('Specification', 75, yPos);
            doc.text('Result', 155, yPos);

            yPos += 2;
            doc.setLineWidth(0.3);
            doc.line(15, yPos, 195, yPos);
            doc.setLineWidth(0.1);

            doc.setFont(undefined, 'normal');
            yPos += 6;

            // Test results rows
            let testIndex = 0;
            data.testResults.forEach((testResult) => {
                // Check if we need a new page
                if (yPos > 255) {
                    addPageNumber(doc, pageNumber, totalPages);
                    doc.addPage();
                    addWatermark();
                    drawHeader(false);
                    pageNumber++;
                    yPos = 48;

                    // Redraw table header on new page
                    doc.setFillColor(240, 240, 240);
                    doc.rect(15, yPos - 5, 180, 8, 'F');

                    doc.setFontSize(9);
                    doc.setFont(undefined, 'bold');
                    doc.text('Test Parameter', 17, yPos);
                    doc.text('Specification', 75, yPos);
                    doc.text('Result', 155, yPos);

                    yPos += 2;
                    doc.setLineWidth(0.3);
                    doc.line(15, yPos, 195, yPos);
                    doc.setLineWidth(0.1);

                    doc.setFont(undefined, 'normal');
                    yPos += 6;
                }

                doc.setFontSize(8.5);

                // Handle section headers
                if (testResult.type === 'header') {
                    yPos += 2;
                    doc.setFontSize(9.5);
                    doc.setFont(undefined, 'bold');
                    doc.setFillColor(102, 126, 234);
                    doc.rect(15, yPos - 4, 180, 7, 'F');
                    doc.setTextColor(255, 255, 255);
                    doc.text(testResult.test, 17, yPos + 1);
                    doc.setTextColor(0, 0, 0);
                    doc.setFont(undefined, 'normal');
                    doc.setFontSize(8.5);
                    yPos += 9;
                    return;
                }

                let result = testResult.result || '-';

                // Auto add unit if specification has unit
                const unit = extractUnit(testResult.specification);
                if (unit && !isNaN(result) && !result.includes(unit)) {
                    result = result + " " + unit;
                }

                // Split long text to fit columns
                const testLines = doc.splitTextToSize(testResult.test, 56);
                const specLines = doc.splitTextToSize(testResult.specification, 78);
                const resultLines = doc.splitTextToSize(result, 38);

                // Draw alternating row background
                const maxLines = Math.max(testLines.length, specLines.length, resultLines.length);
                const rowHeight = maxLines * 4.5 + 2;

                if (testIndex % 2 === 0) {
                    doc.setFillColor(250, 250, 250);
                    doc.rect(15, yPos - 3, 180, rowHeight, 'F');
                }

                // Draw cell content
                doc.text(testLines, 17, yPos);
                doc.text(specLines, 75, yPos);
                doc.text(resultLines, 155, yPos);

                yPos += rowHeight;
                testIndex++;
            });

            // Footer section
            if (yPos > 235) {
                addPageNumber(doc, pageNumber, totalPages);
                doc.addPage();
                addWatermark();
                drawHeader(false);
                pageNumber++;
                yPos = 48;
            } else {
                yPos += 10;
            }

            // Add border for footer
            doc.setDrawColor(200, 200, 200);
            doc.setLineWidth(0.3);
            doc.line(15, yPos - 5, 195, yPos - 5);

            doc.setFontSize(8);
            doc.setFont(undefined, 'italic');
            doc.setTextColor(100, 100, 100);
            doc.text('This certificate is issued by the Quality Control Department', 15, yPos + 3);
            yPos += 6;
            doc.text('Cognizant Chemical Pvt. Ltd.', 15, yPos);
            yPos += 5;
            doc.setFont(undefined, 'normal');
            doc.text('Authorized Signatory', 15, yPos);
            yPos += 8;
            doc.setFont(undefined, 'bold');
            doc.text('_________________________', 15, yPos);
            yPos += 5;
            doc.setFont(undefined, 'normal');
            doc.setFontSize(7);
            doc.text('Quality Control Manager', 15, yPos);

            // Add page number to last page
            addPageNumber(doc, pageNumber, totalPages);

            // Convert to blob
            const pdfBlob = doc.output('blob');
            return pdfBlob;
        }

        function formatDateForPDF(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}.${month}.${year}`;
        }

        // Close preview modal
        function closePreview() {
            document.getElementById('previewModal').style.display = 'none';
            const iframe = document.getElementById('pdfPreview');
            if (iframe.src) {
                URL.revokeObjectURL(iframe.src);
                iframe.src = '';
            }
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById('previewModal');
            if (event.target == modal) {
                closePreview();
            }
        }
    </script>
    <script>
        // Export to Excel with structured block grouping (UI match)
        async function exportToExcel() {
            try {
                // Check if ExcelJS is loaded
                if (typeof ExcelJS === 'undefined') {
                    alert('Excel export library is loading. Please wait a moment and try again.');
                    return;
                }

                // Show loading
                document.getElementById('loadingOverlay').classList.add('active');

                const documentsToExport = filteredDocuments.length > 0 ? filteredDocuments : allDocuments;
                if (documentsToExport.length === 0) {
                    alert('No documents to export');
                    document.getElementById('loadingOverlay').classList.remove('active');
                    return;
                }

                // Group documents by category and product
                const groupedData = {};
                documentsToExport.forEach(doc => {
                    const category = doc.category || 'Unknown';
                    const productName = doc.productName || doc.chemicalName || 'Unknown Product';

                    if (!groupedData[category]) groupedData[category] = {};
                    if (!groupedData[category][productName]) groupedData[category][productName] = [];
                    groupedData[category][productName].push(doc);
                });

                // Create Workbook & Worksheet
                const workbook = new ExcelJS.Workbook();
                const worksheet = workbook.addWorksheet('COA Report');

                // Styling helpers
                const titleFont = { bold: true, size: 16, color: { argb: 'FF2C3E50' } };
                const subTitleFont = { bold: true, size: 14, color: { argb: 'FF34495E' } };
                const boldFont = { bold: true };
                const headerStyle = {
                    font: { bold: true, color: { argb: 'FFFFFFFF' } },
                    fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF667EEA' } },
                    alignment: { horizontal: 'center', vertical: 'middle' },
                    border: {
                        top: { style: 'thin' },
                        left: { style: 'thin' },
                        bottom: { style: 'thin' },
                        right: { style: 'thin' }
                    }
                };
                const borderStyle = {
                    top: { style: 'thin' },
                    left: { style: 'thin' },
                    bottom: { style: 'thin' },
                    right: { style: 'thin' }
                };

                const sortedCategories = Object.keys(groupedData).sort();
                for (const category of sortedCategories) {
                    const products = Object.keys(groupedData[category]).sort();

                    for (const productName of products) {
                        const batches = groupedData[category][productName];

                        // 1. Identify all dynamic test columns for this specific product
                        const dynamicTestsSet = new Set();
                        batches.forEach(b => {
                            if (b.testResults && Array.isArray(b.testResults)) {
                                b.testResults.forEach(res => {
                                    // Skip description as it has its own fixed column, and skip internal headers
                                    if (res.test && res.type !== 'header' && res.test.toLowerCase() !== 'description') {
                                        dynamicTestsSet.add(res.test);
                                    }
                                });
                            }
                        });
                        const dynamicTests = Array.from(dynamicTestsSet);

                        // 2. Create Header Row
                        const tableHeaders = [
                            'sr no',
                            'Name',
                            'Select Chemical:',
                            'Batch No.:',
                            'Manufacturing Date:',
                            'Expiry Date (Auto-calculated):',
                            'Description',
                            ...dynamicTests
                        ];

                        const headerRow = worksheet.addRow(tableHeaders);
                        headerRow.height = 35; // Taller header for wrap text
                        headerRow.eachCell((cell) => {
                            cell.font = { bold: true, size: 10 };
                            cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
                            cell.border = borderStyle;
                        });

                        // 3. Add Data Rows for each Batch
                        batches.forEach((batch, index) => {
                            const rowData = [
                                index + 1,
                                `${batch.category || 'Unknown'} Test`,
                                batch.productName || batch.chemicalName || '',
                                batch.batchNo || '',
                                formatDateForPDF(batch.mfgDate),
                                formatDateForPDF(batch.expiryDate),
                                '' // Description Placeholder
                            ];

                            // Fill Description
                            if (batch.testResults) {
                                const descRes = batch.testResults.find(r => (r.test || '').toLowerCase() === 'description');
                                if (descRes) rowData[6] = descRes.result || '';
                            }

                            // Fill Dynamic Tests
                            dynamicTests.forEach(testName => {
                                const matchedTest = batch.testResults.find(r => r.test === testName);
                                rowData.push(matchedTest ? matchedTest.result || '' : '');
                            });

                            const dataRow = worksheet.addRow(rowData);
                            dataRow.eachCell((cell) => {
                                cell.border = borderStyle;
                                cell.alignment = { vertical: 'middle', wrapText: true };
                                if (typeof cell.value === 'number') {
                                    cell.alignment.horizontal = 'center';
                                }
                            });
                        });

                        // 4. Spacing between different product tables
                        worksheet.addRow([]);
                        worksheet.addRow([]);
                    }
                }

                // Adjust Column Widths for readability
                worksheet.columns.forEach((column, index) => {
                    if (index === 0) column.width = 6; // sr no
                    else if (index === 1) column.width = 15; // Name
                    else if (index === 2) column.width = 25; // Select Chemical
                    else if (index === 3) column.width = 10; // Batch No
                    else if (index === 4 || index === 5) column.width = 12; // Dates
                    else if (index === 6) column.width = 30; // Description
                    else column.width = 18; // Test columns
                });

                // Export
                const buffer = await workbook.xlsx.writeBuffer();
                const dateStr = new Date().toISOString().split('T')[0];
                saveAs(new Blob([buffer]), `COA_Export_${dateStr}.xlsx`);

                alert('Excel exported successfully in Product-Wise Column Format!');
            } catch (error) {
                console.error('Error:', error);
                alert('Export failed: ' + error.message);
            } finally {
                document.getElementById('loadingOverlay').classList.remove('active');
            }
        }


        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadDocuments();
        });
    </script>
